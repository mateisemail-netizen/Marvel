name: Deploy standalone Marvel archive

on:
  push:
    branches:
      - main
    paths:
      - "standalone/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload standalone site
        uses: actions/upload-pages-artifact@v3
        with:
          path: standalone
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
