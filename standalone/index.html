          All

          Phase 1
        </button>
        <button data-phase="Phase 2" class="phase-btn px-4 py-1.5 rounded-full border border-slate-700 text-sm font-semibold transition">
          Phase 2
        </button>

          Phase 3
        </button>

          Phase 4

          Phase 5
        </button>
        <button data-phase="Phase 6" class="phase-btn px-4 py-1.5 rounded-full border border-slate-700 text-sm font-semibold transition">
          Phase 6
        </button>
        <button data-phase="Upcoming" id="upcomingBtn" class="phase-btn px-4 py-1.5 rounded-full border border-emerald-500 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold shadow-lg shadow-emerald-900/50 transition">

      { title: "Marvel Zombies", phase: "Phase 6", type: "Series", year: 2025, rating: "TBD", description: "New superheroes fight a growing undead plague sweeping through the multiverse.", poster: "https://thumb.wikimedia.org/wikipedia/en/thumb/1/1a/Marvel_Zombies_%28TV_series%29_logo.png/330px-Marvel_Zombies_%28TV_series%29_logo.png", posterFit: "contain" },
      { title: "Wonder Man", phase: "Phase 6", type: "Series", year: 2026, rating: "TBD", description: "Hollywood actor Simon Williams gains ionic powers and enters the superhero stage.", poster: "https://image.tmdb.org/t/p/w500/6yy9nQlFt2l6UVWzrfhszFCaZ5C.jpg" },
      { title: "Spider-Man: Brand New Day", phase: "Phase 6", type: "Movie", year: 2026, rating: "TBD", description: "Peter Parker embarks on a fresh path in New York City.", poster: "https://upload.wikimedia.org/wikipedia/en/9/9a/Spider-Man_Brand_New_Day_poster.jpg" },

      { title: "Avengers: Doomsday", phase: "Upcoming", type: "Movie", year: 2026, rating: "TBD", description: "The Avengers face off against Doctor Doom in a major multiversal showdown.", poster: "https://upload.wikimedia.org/wikipedia/en/e/ee/Avengers_Doomsday_poster.jpg" },
      { title: "Avengers: Secret Wars", phase: "Upcoming", type: "Movie", year: 2027, rating: "TBD", description: "The grand finale of the Multiverse Saga bringing together iconic heroes across worlds.", poster: "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Avengers_Secret_Wars_Logo.svg/960px-Avengers_Secret_Wars_Logo.svg.png", posterFit: "contain-light", posterAlt: "Unofficial fan-made Avengers: Secret Wars logo", posterCredit: { author: "Josephzbazin", source: "https://commons.wikimedia.org/wiki/File:Avengers_Secret_Wars_Logo.svg", license: "https://creativecommons.org/licenses/by-sa/4.0/" } }
    ];

    let watchlist = JSON.parse(localStorage.getItem('mcu_watchlist') || '[]');
    let activePhase = 'ALL';
    let searchQuery = '';
    let showOnlyWatchlist = false;

    const grid = document.getElementById('mcuGrid');
    const searchInput = document.getElementById('searchInput');
    const watchlistToggleBtn = document.getElementById('watchlistToggleBtn');
    const watchlistCount = document.getElementById('watchlistCount');
    const noResults = document.getElementById('noResults');
    const phaseFilterContainer = document.getElementById('phaseFilterContainer');

    const detailModal = document.getElementById('detailModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalPoster = document.getElementById('modalPoster');
    const modalPosterCredit = document.getElementById('modalPosterCredit');
    const modalTitle = document.getElementById('modalTitle');
    const modalPhase = document.getElementById('modalPhase');
    const modalYear = document.getElementById('modalYear');
    const modalType = document.getElementById('modalType');
    const modalRating = document.getElementById('modalRating');
    const modalDescription = document.getElementById('modalDescription');
    const modalWatchlistBtn = document.getElementById('modalWatchlistBtn');

    let currentModalMovie = null;

    function createSvgFallback(title, phase) {
      const isUpcoming = phase === "Upcoming";
      const bgGradStart = isUpcoming ? "#065f46" : "#7f1d1d";
      const bgGradEnd = isUpcoming ? "#022c22" : "#450a0a";
      const accentColor = isUpcoming ? "#10b981" : "#ef4444";
      
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="${bgGradStart}" />
              <stop offset="100%" stop-color="${bgGradEnd}" />
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#grad)"/>
          <rect x="15" y="15" width="270" height="420" fill="none" stroke="${accentColor}" stroke-width="2" opacity="0.4"/>
          <text x="150" y="210" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">${title}</text>
          <text x="150" y="240" font-family="sans-serif" font-size="14" fill="${accentColor}" text-anchor="middle" font-weight="bold">${phase.toUpperCase()}</text>
        </svg>
      `;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function render() {
      watchlistCount.textContent = watchlist.length;

      const filtered = moviesData.filter(movie => {
        const matchesPhase = activePhase === 'ALL' || movie.phase === activePhase;
        const matchesSearch = movie.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              movie.description.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesWatchlist = !showOnlyWatchlist || watchlist.includes(movie.title);

        return matchesPhase && matchesSearch && matchesWatchlist;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');
      grid.innerHTML = filtered.map(movie => {
        const isUpcoming = movie.phase === "Upcoming";
        const poster = movie.poster || createSvgFallback(movie.title, movie.phase);
        const posterFit = movie.posterFit === "contain" ? "object-contain p-6" :
          movie.posterFit === "contain-light" ? "object-contain p-6 bg-white" : "object-cover";
        const posterCredit = movie.posterCredit
          ? `<p class="mt-2 text-[9px] leading-tight text-slate-400"><span>Unofficial fan-made logo by </span><a href="${movie.posterCredit.source}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="underline hover:text-white">${movie.posterCredit.author}</a><span> · </span><a href="${movie.posterCredit.license}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" class="underline hover:text-white">CC BY-SA 4.0</a></p>`
          : "";

        return `
          <div class="bg-slate-900/80 border border-slate-800 rounded-xl overflow-hidden shadow-lg hover:border-slate-600 transition flex flex-col group cursor-pointer" onclick="openModal('${movie.title.replace(/'/g, "\'")}')">
            <div class="relative aspect-[2/3] bg-slate-950 overflow-hidden">
              <img src="${poster}" alt="${movie.posterAlt || movie.title}" loading="lazy" decoding="async"
                   class="w-full h-full ${posterFit} group-hover:scale-105 transition duration-300"
                   onerror="this.onerror=null; this.src='${createSvgFallback(movie.title.replace(/'/g, "&apos;"), movie.phase)}';">
              <span class="absolute top-2 left-2 px-2 py-0.5 text-[10px] font-bold rounded ${isUpcoming ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'} shadow">
                ${movie.phase}
              </span>
            </div>
            <div class="p-3 flex flex-col justify-between flex-grow">
              <div>
                <h3 class="font-bold text-white text-sm line-clamp-1 group-hover:text-red-400 transition">${movie.title}</h3>
                <div class="flex items-center justify-between text-xs text-slate-400 mt-1">
                  <span>${movie.year}</span>
                  <span class="text-amber-400 font-semibold"><i class="fa-solid fa-star text-[10px]"></i> ${movie.rating}</span>
                </div>
                ${posterCredit}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(title) {
      const movie = moviesData.find(m => m.title === title);
      if (!movie) return;
      currentModalMovie = movie;

      modalTitle.textContent = movie.title;
      modalPhase.textContent = movie.phase;
      modalYear.innerHTML = `<i class="fa-regular fa-calendar mr-1"></i> ${movie.year}`;
      modalType.innerHTML = `<i class="fa-solid fa-tv mr-1"></i> ${movie.type}`;
      modalRating.innerHTML = `<i class="fa-solid fa-star mr-1"></i> ${movie.rating}`;
      modalDescription.textContent = movie.description;
      modalPoster.src = movie.poster || createSvgFallback(movie.title, movie.phase);
      modalPoster.alt = movie.posterAlt || movie.title;
      modalPoster.classList.toggle("object-contain", movie.posterFit === "contain-light");
      modalPoster.classList.toggle("object-cover", movie.posterFit !== "contain-light");
      modalPoster.classList.toggle("bg-white", movie.posterFit === "contain-light");
      modalPosterCredit.innerHTML = movie.posterCredit
        ? `Unofficial fan-made logo by <a href="${movie.posterCredit.source}" target="_blank" rel="noopener noreferrer" class="underline hover:text-white">${movie.posterCredit.author}</a>. Licensed under <a href="${movie.posterCredit.license}" target="_blank" rel="noopener noreferrer" class="underline hover:text-white">CC BY-SA 4.0</a>.`
        : "";
      modalPosterCredit.classList.toggle("hidden", !movie.posterCredit);
      modalPoster.onerror = function() {
        this.onerror = null;
        this.src = createSvgFallback(movie.title, movie.phase);
      };

      updateModalWatchlistBtn();
      detailModal.classList.remove('hidden');
    }

    function updateModalWatchlistBtn() {
      if (!currentModalMovie) return;
      const inWatchlist = watchlist.includes(currentModalMovie.title);
      if (inWatchlist) {
        modalWatchlistBtn.className = "w-full py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 border border-amber-500 bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 transition";
        modalWatchlistBtn.innerHTML = `<i class="fa-solid fa-check"></i> In Watchlist`;
      } else {
        modalWatchlistBtn.className = "w-full py-2.5 rounded-xl font-bold flex items-center justify-center gap-2 border border-slate-700 bg-slate-800 hover:bg-slate-700 text-white transition";
        modalWatchlistBtn.innerHTML = `<i class="fa-solid fa-bookmark"></i> Add to Watchlist`;
      }
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    phaseFilterContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.phase-btn');
      if (!btn) return;

      document.querySelectorAll('.phase-btn').forEach(b => {
        b.classList.remove('active', 'upcoming-active');
      });

      const phase = btn.dataset.phase;
      activePhase = phase;

      if (phase === 'Upcoming') {
        btn.classList.add('upcoming-active');
      } else {
        btn.classList.add('active');
      }

      render();
    });

    watchlistToggleBtn.addEventListener('click', () => {
      showOnlyWatchlist = !showOnlyWatchlist;
      if (showOnlyWatchlist) {
        watchlistToggleBtn.classList.replace('bg-slate-800', 'bg-amber-500');
        watchlistToggleBtn.classList.replace('text-amber-400', 'text-slate-950');
      } else {
        watchlistToggleBtn.classList.replace('bg-amber-500', 'bg-slate-800');
        watchlistToggleBtn.classList.replace('text-slate-950', 'text-amber-400');
      }
      render();
    });

    modalWatchlistBtn.addEventListener('click', () => {
      if (!currentModalMovie) return;
      const index = watchlist.indexOf(currentModalMovie.title);
      if (index > -1) {
        watchlist.splice(index, 1);
      } else {
        watchlist.push(currentModalMovie.title);
      }
      localStorage.setItem('mcu_watchlist', JSON.stringify(watchlist));
      updateModalWatchlistBtn();
      render();
    });

    closeModalBtn.addEventListener('click', () => {
      detailModal.classList.add('hidden');
    });

    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) detailModal.classList.add('hidden');
    });

    render();
  </script>
</body>
</html>
